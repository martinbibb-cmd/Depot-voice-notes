name = "depot-voice-notes"
main = "src/worker.js"
compatibility_date = "2024-11-08"

[vars]
# Lock this to your site origin(s) for security:
ALLOWED_ORIGIN = "https://YOUR-DOMAIN.example"

# Set your secrets via:
#   wrangler secret put OPENAI_API_KEY
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put GEMINI_API_KEY

# D1 Database for agent reference materials
[[d1_databases]]
binding = "DB"
database_name = "depot-voice-notes"
database_id = "6f08f29d-7490-41b2-83f8-316eb44b7a39"

# R2 Bucket for reference documents
[[r2_buckets]]
binding = "REFERENCE_BUCKET"
bucket_name = "reference"

[[r2_buckets]]
binding = "VISIT_BUCKET"
bucket_name = "speccheck-visits"
